<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jordens krafter – plugga geografi</title>
<style>
:root{
  --blue:#0f6b78;--blue-d:#0a4c56;--blue-l:#e0f2f4;--yellow:#ffc933;--yellow-d:#b88600;
  --ink:#12212b;--muted:#44586a;--bg:#f2f7f6;--card:#ffffff;--line:#d3e0e0;
  --ok:#156b2f;--ok-bg:#d9f2e0;--bad:#b3261e;--bad-bg:#fde3e1;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow-d);outline-offset:2px}
header{background:radial-gradient(2px 2px at 24px 14px,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 96px 40px,rgba(255,255,255,.5),transparent),linear-gradient(135deg,#0b3c5d,#117a8b);background-size:200px 60px,200px 60px,auto;color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hud{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.hud h1{font-size:1.05rem;margin:0;white-space:nowrap}
.hud .lvl{flex:1;min-width:0}
.hud .lvl small{display:block;font-size:.8rem;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .5s}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:12px;min-width:44px;min-height:44px;font-size:1.2rem}
.iconbtn:hover{background:rgba(255,255,255,.28)}
main{max-width:900px;margin:0 auto;padding:18px 14px 60px}
h2{margin:.2em 0 .5em;font-size:1.5rem}
h3{margin:.2em 0 .4em}
.sub{color:var(--muted);margin:0 0 1em}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.menu{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tile{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:block;width:100%;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--blue)}
.tile .em{font-size:2rem;display:block}
.tile b{display:block;font-size:1.15rem;margin:.2em 0}
.tile span.d{color:var(--muted);font-size:.95rem}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-weight:700}
.btn:hover{background:var(--blue-d)}
.btn.alt{background:var(--yellow);color:#12212b}
.btn.alt:hover{background:#ffd95e}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 14px;min-height:44px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.stat{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-weight:700}
.stat .grow{flex:1}
.q{font-size:1.2rem;font-weight:600}
.q.big{font-size:1.8rem;text-align:center;padding:10px 0}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.opt .k{background:var(--blue-l);color:var(--blue-d);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800;flex:none}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--ok-bg);color:#0d4a1f}
.fb.bad{background:var(--bad-bg);color:#7a1610}
.fb p{margin:.3em 0 0;font-weight:400}
.mem{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mc{min-height:104px;border-radius:14px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-size:1.8rem;display:grid;place-items:center;padding:8px;text-align:center}
.mc.open{background:var(--card);color:var(--ink);border-color:var(--line);font-size:.88rem;line-height:1.3;font-weight:600}
.mc.open.term{background:var(--yellow);border-color:var(--yellow-d);font-size:1.05rem;font-weight:800}
.mc.done{background:var(--ok-bg);border-color:var(--ok);color:#0d4a1f}
.mc.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.06)}}
.sortcard{font-size:1.5rem;font-weight:800;text-align:center;padding:26px 12px;background:var(--yellow);border-radius:var(--r);border:2px solid var(--yellow-d);margin:10px 0 14px}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bucket{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:16px 10px;font-weight:800;min-height:64px}
.bucket:hover:not(:disabled){background:var(--blue-d)}
.bucket.right{background:var(--ok)}
.bucket.wrong{background:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.list{display:grid;gap:10px}
details.t{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0}
details.t summary{padding:12px 14px;font-weight:700;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:8px}
details.t[open]{border-color:var(--blue)}
details.t .d{padding:0 14px 14px;color:var(--ink)}
details.t .d p{margin:.3em 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.dot.m{background:var(--ok)}
input[type=search]{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 4px}
.model{background:var(--blue-l);border-radius:12px;padding:12px 14px;margin:8px 0}
.model p{margin:.2em 0}
.prog{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.prog>i{display:block;height:100%;background:var(--blue)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--muted);font-size:.88rem}
.badge.on{border:2px solid var(--yellow-d);background:#fff8d6;color:var(--ink)}
.badge .em{font-size:1.8rem;display:block;filter:grayscale(1);opacity:.45}
.badge.on .em{filter:none;opacity:1}
.stars{font-size:2.4rem;letter-spacing:6px;color:var(--yellow-d)}
.center{text-align:center}
.done-tag{color:var(--ok);font-weight:800}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:30;transition:transform .3s;max-width:90vw;text-align:center;font-weight:700}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{background:linear-gradient(135deg,#0b3c5d,#16899a);color:#fff;border-radius:var(--r);padding:8px 20px 14px;margin-bottom:16px}
.hero h2{margin-top:.5em}.hero p{margin:0;opacity:.95}
.slots{margin:6px 0;padding-left:30px}
.slot{background:var(--ok-bg);border:2px solid var(--ok);color:#0d4a1f;border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:600}
.pool{display:grid;gap:10px}
.transcript{display:grid;gap:8px;margin-top:14px}
.pl{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.pl b{display:block}
.pl small{display:block;color:var(--muted)}
.pl.host{background:var(--blue-l);margin-right:12%}
.pl.exp{background:#fff8d6;margin-left:12%}
.pl.host b,.pl.exp b{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pl.now{border-color:var(--blue);box-shadow:0 0 0 3px rgba(15,107,120,.35);background:var(--blue-l)}
.ex{background:#fff8d6;border-left:4px solid var(--yellow-d);border-radius:8px;padding:8px 12px;margin:8px 0}
.links{margin-top:10px}
.linkrow{display:block;width:100%;text-align:left;background:var(--blue-l);border:0;border-radius:10px;padding:8px 12px;margin:6px 0;min-height:44px}
.linkrow:hover{background:#cbe7ea}
.rate{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px}
.ask{margin:10px 0 4px;padding-left:22px}
.ask li{margin:4px 0}
.log{margin-top:14px;display:grid;gap:8px}
.ext a{color:var(--blue-d);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hud">
    <button class="iconbtn" id="back" aria-label="Tillbaka till menyn" hidden>←</button>
    <h1>🌍 Jordens krafter</h1>
    <div class="lvl">
      <small id="lvlname"></small>
      <div class="bar" role="progressbar" aria-label="Erfarenhetspoäng till nästa nivå" aria-valuemin="0" aria-valuemax="100" id="xpbar"><i id="xpfill"></i></div>
    </div>
    <button class="iconbtn" id="snd" aria-label="Ljud av/på" aria-pressed="true">🔊</button>
  </div>
</header>
<main id="app"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ===DATA-START=== */
/* ============ DATA (från Geografibegrepp – Jordens krafter.pdf) ============ */
const SECTIONS={1:"Kartor & koordinater",2:"Solen & årstiderna",3:"Väder & stormar",4:"Vindar & havsströmmar",5:"Klimat & natur"};
const TERMS=[
{"sec":3,"t":"Atmosfären","d":"Området mellan jordytan och rymden.","e":"Utan atmosfären skulle jorden sakna syre att andas och skydd mot farlig solstrålning, precis som en osynlig skyddsfilt av gaser runt planeten."},
{"sec":1,"t":"Breddgrad","d":"Uppdelning av jordklotet i 90 grader nordlig och sydlig bredd.","e":"Genom att mäta en plats breddgrad norr eller söder om ekvatorn kan man avgöra hur varmt klimatet brukar vara, eftersom solstrålarna träffar jorden mer snett ju högre gradtalet är."},
{"sec":1,"t":"Ekvatorn","d":"Den breddgrad som är midjan på jorden.","e":"Vid ekvatorn (breddgrad 0°) träffar solens strålar jorden rakt framifrån året runt, vilket gör att det alltid är varmt och att dag och natt är ungefär 12 timmar vardera."},
{"sec":5,"t":"Glaciär","d":"Is som ligger på land och är i rörelse, till skillnad från inlandsis, som ligger stilla.","e":"När snö packas ihop under tusentals år på ett högt berg bildas en glaciär som är så tung att den sakta glider nedför dalgången och slipar berggrunden under sig.","s":"Is på land som är i rörelse (inlandsis ligger stilla)"},
{"sec":4,"t":"Golfströmmen","d":"Havsström från ekvatorn som gör Sveriges klimat varmare.","e":"Trots att Sverige ligger lika långt norrut som det iskalla Alaska har vi betydligt mildare vintrar eftersom Golfströmmen för med sig varmt ytvatten ända från Mexikanska golfen upp längs Norges kust."},
{"sec":5,"t":"Grundvatten","d":"Det vatten som finns lagrat i marken.","e":"När regn och smält snö sjunker ner genom jordlagren fylls grundvattnet på, vilket fungerar som en underjordisk vattenreservoar som vi hämtar vårt dricksvatten ur via brunnar."},
{"sec":4,"t":"Havsström","d":"Transport av vatten i världshaven.","e":"Vindar, jordens rotation och skillnader i vattnets temperatur och salthalt skapar en havsström, som fungerar likt en gigantisk flod i havet som sprider värme runt jorden.","s":"Transport av vatten i världshaven"},
{"sec":3,"t":"Högtryck","d":"Område där nedkyld, torr luft sjunker mot jordytan.","e":"Eftersom luften i ett högtryck sjunker nedåt värms den upp och eventuella moln löses upp, vilket brukar ge klart, soligt och vindstilla väder."},
{"sec":5,"t":"Inlandsklimat","d":"Klimat med varma, torra somrar och kalla vintrar.","e":"Långt inne på en kontinent, som i centrala Ryssland, råder inlandsklimat eftersom det inte finns något hav i närheten som kan kyla ner luften på sommaren eller värma upp den på vintern."},
{"sec":4,"t":"Intertropiska konvergenszonen","d":"Det bälte runt jorden där nordostpassaden och sydostpassaden möts.","e":"Runt ekvatorn pressas varm och fuktig luft uppåt när vindarna möts i den intertropiska konvergenszonen, vilket får luften att kylas av och bilda kraftiga regnmoln nästan varje dag.","s":"Bältet runt jorden där nordostpassaden och sydostpassaden möts"},
{"sec":3,"t":"Klimat","d":"Vädret under 30 år ligger till grund för de beräkningar som meteorologer gör för att bestämma en plats klimat.","e":"Även om det råkar vara ovanligt kallt och regnigt en enskild juli-vecka har Medelhavsområdet ändå ett varmt och torrt klimat, eftersom det är genomsnittet över minst 30 år som räknas.","s":"Vädrets genomsnitt över minst 30 år"},
{"sec":5,"t":"Klimatzon","d":"Ett område på jorden där alla platser har ungefär samma klimat. Det finns fyra olika klimatzoner.","e":"Beroende på hur mycket solenergi som når olika delar av jorden delas världen in i fyra klimatzoner: tropiska, subtropiska, tempererade (där Sverige ligger) och polarzonen.","s":"Område där alla platser har ungefär samma klimat – det finns fyra"},
{"sec":1,"t":"Koordinat","d":"Tal som anger en punkt på en karta där längd- och breddgrader möts.","e":"Genom att kombinera en nordlig/sydlig och en östlig/västlig koordinat kan en GPS peka ut en exakt plats var som helst på jordklotet med några meters noggrannhet."},
{"sec":5,"t":"Kustklimat","d":"Klimat med kalla, fuktiga somrar och milda vintrar.","e":"Eftersom havet värms upp och kyls ner mycket långsammare än land får städer som Göteborg och Bergen ett kustklimat, där havet dämpar både sommarhettan och vinterkylan."},
{"sec":3,"t":"Lågtryck","d":"Område där uppvärmd, fuktig luft stiger från jordytan.","e":"När varm luft stiger uppåt i ett lågtryck kyls den ner på hög höjd så att vattenångan bildar moln, vilket oftast leder till blåsigt och regnigt väder."},
{"sec":1,"t":"Längdgrad","d":"Uppdelning av jordklotet i 180 grader östlig och västlig längd.","e":"Varje längdgrad löper som en apelsinklyfta från nordpolen till sydpolen och avgör vilken tidszon en plats tillhör beroende på hur långt öster eller väster om Greenwich den ligger."},
{"sec":1,"t":"Meridian","d":"Annat namn för längdgrad, används oftast bara om nollmeridianen.","e":"Alla linjer på kartan som går rakt från pol till pol är en meridian, och utifrån den viktigaste av dem – nollmeridianen – räknas både östliga och västliga längdgrader samt världens tidszoner.","s":"Annat namn för längdgrad, oftast om nollmeridianen"},
{"sec":4,"t":"Monsun","d":"Vind som blåser åt ett håll på sommaren och det motsatta på vintern, drar med sig regn från havet.","e":"På sommaren värms den asiatiska kontinenten upp snabbare än havet, vilket drar in en fuktig monsun från Indiska oceanen som ger livsviktigt regn till risodlingarna, medan vinden vänder och ger torka på vintern.","s":"Vind som byter håll mellan sommar och vinter och drar med sig regn från havet"},
{"sec":3,"t":"Nederbörd","d":"Samlingsnamn för regn, snö och hagel.","e":"När vattendroppar eller iskristaller i ett moln blir så tunga att luften inte längre orkar hålla dem uppe faller de till marken som nederbörd."},
{"sec":1,"t":"Nollmeridianen","d":"Den längdgrad som går genom Greenwich och som är längdgrad 0.","e":"Precis som ekvatorn är startlinjen för breddgrader utgör nollmeridianen i London startlinjen (0°) varifrån man mäter avståndet österut och västerut runt jordklotet."},
{"sec":3,"t":"Orkan","d":"Stort stormoväder som uppstår över varmt hav.","e":"När havsvattnet är minst 26–27 grader varmt stiger enorma mängder fuktig luft uppåt och börjar rotera, vilket kan utvecklas till en förödande orkan med extrema vindstyrkor och skyfall."},
{"sec":4,"t":"Passadvind","d":"Vind som alltid blåser från samma håll kring ekvatorn: norr om ekvatorn från nordost, söder om ekvatorn från sydost.","e":"Varm luft som stiger vid ekvatorn ersätts ständigt av luft som strömmar in från subtropiska högtryck och böjs av genom jordens rotation, vilket skapar den pålitliga passadvinden som segelfartyg förr utnyttjade över Atlanten.","s":"Vind som alltid blåser från samma håll kring ekvatorn (nordost/sydost)"},
{"sec":2,"t":"Polcirkel","d":"Område mellan en viss breddgrad och polen, där solen skiner i 24 timmar under minst en sommardag och där solen inte går upp alls under minst en vinterdag.","e":"Eftersom jordaxeln lutar 23,5 grader hamnar området innanför respektive polcirkel helt vänt mot solen under sommaren (midnattssol) och helt bortvänt från solen under vintern (polarnatt).","s":"Gräns där solen skiner 24 timmar minst en sommardag och uteblir minst en vinterdag"},
{"sec":5,"t":"Regnperiod","d":"I områden med två årstider är det den del av året då det regnar.","e":"När den intertropiska konvergenszonen förflyttar sig norrut eller söderut under året för den med sig en regnperiod, då floder svämmar över och det torra landskapet snabbt blir grönt."},
{"sec":5,"t":"Regnskog","d":"Skog som växer i områden där det regnar varje dag under minst nio månader varje år.","e":"Runt ekvatorn, där det är varmt och regnar nästan varje dag året om, växer tät regnskog i flera våningar som rymmer över hälften av världens alla växt- och djurarter.","s":"Skog i område där det regnar varje dag under minst nio månader per år"},
{"sec":5,"t":"Savann","d":"Område med gräs, buskar och enstaka träd. Ligger mellan regnskogen och stäppen.","e":"På den afrikanska savannen är regnperioden för kort för att en tät skog ska kunna växa, men tillräcklig för att högt gräs och enstaka träd ska ge föda åt stora hjordar av zebror, gnuer och elefanter.","s":"Område med gräs, buskar och enstaka träd mellan regnskog och stäpp"},
{"sec":2,"t":"Sommarsolstånd","d":"När solen är uppe som längst på sommaren, omkring 21 juni.","e":"Vid sommarsolståndet lutar norra halvklotet som allra mest in mot solen, vilket ger oss årets längsta dag och ljusaste natt.","s":"När solen är uppe som längst på sommaren, omkring 21 juni"},
{"sec":5,"t":"Stäpp","d":"Område med gräs och enstaka buskar. Ligger mellan öknen och savannen.","e":"Där det regnar för lite för att träd ska klara sig, men ändå mer än i en öken, breder en torr stäpp ut sig med tåligt gräs och låga buskar.","s":"Område med gräs och enstaka buskar mellan öken och savann"},
{"sec":1,"t":"Topografisk karta","d":"Karta som visar höjdskillnader med höjdkurvor.","e":"När man tittar på en topografisk karta ser man direkt var bergen är som brantast, eftersom höjdkurvorna då ligger mycket tätt intill varandra."},
{"sec":5,"t":"Torrperiod","d":"I områden med två årstider är det den halva av året då det inte regnar.","e":"Under torrperioden på savannen faller inget regn på flera månader, vilket gör att gräset vissnar och många djur tvingas vandra långt för att hitta vattenhål."},
{"sec":3,"t":"Tromb","d":"Annat namn för virvelvind.","e":"När en kraftig virvelvind uppstår över land, till exempel under ett sommaråskväder i Sverige, används ofta begreppet tromb istället för tornado."},
{"sec":2,"t":"Tropikerna","d":"Området mellan vändkretsarna.","e":"I tropikerna, bältet runt ekvatorn mellan Kräftans och Stenbockens vändkrets, står solen högt på himlen året runt så att det aldrig blir någon kall vinter."},
{"sec":3,"t":"Troposfären","d":"Den del av atmosfären som ligger närmast jordytan. Innehåller vindar, regn och annat väder som påverkar oss.","e":"Allt det vi kallar väder – som moln, regnskurar, åska och vindar – utspelar sig i troposfären, eftersom det är där nästan all vattenånga och luftmassa finns samlad.","s":"Atmosfärens nedersta del, där vädret finns"},
{"sec":3,"t":"Tyfon","d":"Samma sak som orkan fast i Stilla havet eller Indiska oceanen.","e":"Det är exakt samma typ av kraftiga tropiska stormoväder som i Atlanten, men när den bildas över varmt hav i Asien och drabbar exempelvis Japan eller Filippinerna kallas den för en tyfon.","s":"Samma sak som orkan, fast i Stilla havet eller Indiska oceanen"},
{"sec":3,"t":"Varmfront","d":"Varm luftmassa som rör sig framåt.","e":"Eftersom varm luft är lättare än kall glider en varmfront sakta upp ovanpå den kalla luften framför den, vilket först märks som höga slöjmoln och därefter ett långvarigt, stilla regn."},

/* Matchning av begrepp i text (böjningar), används för att dölja svaret i frågor */
const TERM_RE={"Klimat":"klimat(?:et|ets|s)?(?![\\p{L}])","Väder":"väd(?:er|ret|rets|ers)?(?![\\p{L}])"};
const stemOf=w=>w.toLowerCase().replace(/(erna|arna|orna|en|et|n|t|a|e)$/,"");
function termSrc(t){
  if(TERM_RE[t.t])return TERM_RE[t.t];
  return t.t.split(" ").map(w=>stemOf(w)+"\\p{L}*").join("[^\\p{L}]+");
}
TERMS.forEach(t=>{const s=termSrc(t);t.re=new RegExp("(^|[^\\p{L}])("+s+")","iu");t.reg=new RegExp("(^|[^\\p{L}])("+s+")","giu")});

const PODCAST={id:"pod",t:"Hela repetitionen",min:"ca 18 min – podd med två röster",audio:"geografipodden.mp3",lines:[["A", "Välkommen till Geografipodden. Idag ska vi gå igenom grunderna i jordens krafter och geografi inför det muntliga provet i årskurs sju."], ["B", "Ja, det bästa sättet att klara ett muntligt prov är ju inte bara att rabbla ord, utan att förstå hur allt faktiskt hänger ihop."], ["A", "Precis så är det. Vi ska bygga upp förståelsen steg för steg, från kartans linjer till vindar, havsströmmar och hur naturen formas."], ["B", "Det låter som en bra plan. Var börjar vi när vi vill orientera oss och hitta en plats på jorden?"], ["A", "Man börjar med väderstrecken. Väderstreck är samlingsnamnet för norr, söder, öster och väster."], ["B", "Och med hjälp av solens position på himlen eller en enkel kompass kan man ta ut de fyra väderstrecken i naturen."], ["A", "Men om du vill beskriva en exakt punkt på jordklotet räcker det förstås inte med att bara säga att man ska gå mot norr."], ["B", "Nej, då behöver vi ett ordentligt rutnät över hela planeten, precis som i ett koordinatsystem i matten."], ["A", "Exakt. Det rutnätet består av två sorters linjer: breddgrader och längdgrader. Vi kan börja med breddgraderna."], ["B", "En breddgrad är en uppdelning av jordklotet i nittio grader nordlig och nittio grader sydlig bredd."], ["A", "Och startlinjen för breddgraderna är ekvatorn, som ligger på breddgrad noll. Man kan tänka på ekvatorn som midjan på jorden."], ["B", "Vid ekvatorn träffar solens strålar jorden rakt framifrån året runt, så där är det alltid varmt och dag och natt är ungefär tolv timmar vardera."], ["A", "Om man mäter en plats breddgrad, alltså hur långt norr eller söder om ekvatorn den ligger, kan man avgöra hur varmt klimatet brukar vara."], ["B", "Eftersom jorden är rund träffar solstrålarna marken mer snett ju högre gradtalet är, och därför blir det kallare ju längre från ekvatorn man kommer."], ["A", "Så breddgrad hänger direkt ihop med klimat. Den andra sortens linjer är längdgraderna."], ["B", "Längdgrad är en uppdelning av jordklotet i etthundraåttio grader östlig och etthundraåttio grader västlig längd."], ["A", "De löper som apelsinklyftor från nordpolen till sydpolen. Ett annat namn för längdgrad är meridian."], ["B", "Och den viktigaste meridianen är nollmeridianen, som går rakt genom Greenwich i London och har värdet längdgrad noll."], ["A", "Från den mäter man avståndet österut och västerut, och det är utifrån längdgraderna som världens tidszoner bestäms."], ["B", "Så breddgrad styr klimat och temperatur, medan längdgrad styr vilken tid på dygnet och vilken tidszon vi har."], ["A", "Precis så. Och när en breddgrad och en längdgrad möts får man en koordinat, ett tal som anger en exakt punkt på kartan."], ["B", "Det är så en GPS fungerar när den kombinerar nordlig eller sydlig bredd med östlig eller västlig längd för att hitta rätt med några meters marginal."], ["A", "Sedan har vi den topografiska kartan, som visar höjdskillnader i landskapet med hjälp av höjdkurvor."], ["B", "När höjdkurvorna ligger tätt intill varandra på kartan vet man att det är väldigt brant, som i ett bergsområde."], ["A", "Då har vi kartan klar för oss. Nu ska vi titta närmare på solen och varför vi egentligen har årstider."], ["B", "Och här finns det en viktig grundorsak som allt bygger på: jordaxeln lutar tjugotre och en halv grader."], ["A", "Många tror ju felaktigt att det är sommar för att jorden är närmare solen, men det handlar helt och hållet om jordaxelns lutning."], ["B", "När jorden snurrar runt solen lutar vår halva in mot solen under sommaren, och bort från solen under vintern."], ["A", "Det gör att mängden solljus och solvärme växlar, vilket ger oss våra fyra tydliga årstider i Sverige: vår, sommar, höst och vinter."], ["B", "Ett centralt begrepp här är zenit. Vad innebär det egentligen när solen står i zenit?"], ["A", "Zenit betyder att solen står nittio grader rakt upp på himlen ovanför betraktaren. Då träffar strålarna marken rakt uppifrån och kastar ingen skugga åt sidorna."], ["B", "Och eftersom strålarna inte sprids ut ger det maximal värme. Men solen kan bara stå i zenit i ett visst område på jorden."], ["A", "Just det, bara i tropikerna, vilket är bältet runt ekvatorn mellan de två vändkretsarna."], ["B", "Vändkretsarna ligger på tjugotre och en halv grader norr och söder om ekvatorn: Kräftans vändkrets i norr och Stenbockens vändkrets i söder."], ["A", "Eftersom jordaxeln lutar just tjugotre och en halv grader markerar vändkretsarna den yttersta gränsen för var solen någonsin kan stå i zenit."], ["B", "I tropikerna står solen högt året om, och därför blir det aldrig någon riktigt kall vinter där."], ["A", "Tittar vi istället längst upp i norr eller längst ner i söder hittar vi polcirkeln, området mellan en viss breddgrad och polen."], ["B", "Innanför polcirkeln skiner solen tjugofyra timmar i sträck under minst en sommardag, vilket kallas midnattssol."], ["A", "Och på vintern går solen inte upp alls under minst ett helt dygn, vilket kallas polarnatt."], ["B", "Allt detta styrs alltså av jordaxelns lutning. Och det finns tre viktiga datum eller vändpunkter på året som man ska kunna till provet."], ["A", "Den första är vårdagjämningen omkring tjugonde mars. Då ligger jordaxeln i nittio graders vinkel mot solen, så dag och natt är tolv timmar långa överallt på jorden."], ["B", "Sedan kommer sommarsolståndet omkring tjugoförsta juni, när norra halvklotet lutar som allra mest mot solen. Det är årets längsta dag och ljusaste natt."], ["A", "Och motsatsen är vintersolståndet omkring tjugoförsta december. Då lutar norra halvklotet som mest bort från solen, och vi får årets kortaste dag."], ["B", "Vid vintersolståndet har området innanför polcirkeln polarnatt, och vid sommarsolståndet har de midnattssol."], ["A", "Nu rör vi oss uppåt i luften och går in på atmosfär och väder."], ["B", "Atmosfären är området mellan jordytan och rymden, som fungerar som en skyddsfilt av gas function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}
  return e;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function wsample(items,k,wf){
  const arr=items.slice(),out=[];
  while(out.length<k&&arr.length){
    const ws=arr.map(wf);let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    for(;i<arr.length-1;i++){r-=ws[i];if(r<=0)break}
    out.push(arr.splice(i,1)[0]);
  }
  return out;
}

let ac;
function tone(f,d,type="sine",t0=0,vol=.15){
  if(!S.sound)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function confetti(){
  if(reduce)return;
  const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#0f6b78","#ffc933","#ffffff","#2e9b4f","#3b82c4"];
  const ps=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<130)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);
  })();
}

  let d=shuffle(TERMS.filter(x=>x.sec===t.sec&&!bad(x))).slice(0,k);
  if(d.length<k)d=d.concat(shuffle(TERMS.filter(x=>!bad(x)&&!d.includes(x))).slice(0,k-d.length));
  return d;
}
function termQ(t){

    return{id:t.id,tag:"Vilket begrepp beskrivs?",prompt:p,opts:shuffle([{text:t.t,ok:true},...distract(t,x=>mentions(p,x)).map(x=>({text:x.t}))]),explain:`${t.t}: ${t.d}`};
  }

    const p=mask(t.e,t);
    return{id:t.id,tag:"Vilket begrepp passar exemplet?",prompt:p,opts:shuffle([{text:t.t,ok:true},...distract(t,x=>mentions(p,x)).map(x=>({text:x.t}))]),explain:`${t.t}: ${t.d}`};

}
const factQ=f=>({id:f.id,tag:"Fakta",prompt:f.q,opts:shuffle([{text:f.a,ok:true},...f.w.map(text=>({text}))]),explain:f.e});
function linkQ(l){

  const p=mask(l.why,t);
  return{id:t.id,tag:"Vilket begrepp saknas?",prompt:p,opts:shuffle([{text:t.t,ok:true},...distract(t,x=>mentions(l.why,x)).map(x=>({text:x.t}))]),explain:`${t.t} och ${o.t} hänger ihop: ${l.why}`};

function pickPairs(sec,n){
  const pool=LINKS.filter(l=>!sec||BYID[l.a].sec===sec||BYID[l.b].sec===sec);
  let best=[];
  for(let attempt=0;attempt<60&&best.length<n;attempt++){
    const chosen=[],used=new Set();
    const wf=l=>(weight(l.a)+weight(l.b))/2,rest=LINKS.filter(l=>!pool.includes(l));
    for(const l of [...wsample(pool,pool.length,wf),...wsample(rest,rest.length,wf)]){
      if(used.has(l.a)||used.has(l.b))continue;
      if([...used].some(u=>adjacent(u,l.a)||adjacent(u,l.b)))continue;
      chosen.push(l);used.add(l.a);used.add(l.b);
      if(chosen.length===n)break;
    }
    if(chosen.length>best.length)best=chosen;
  }
  return best;
}
function playMemory(sec,variant="def"){
  let cards,pairsTotal,matches;
  if(variant==="links"){
    const pairs=pickPairs(sec,6);
    cards=shuffle(pairs.flatMap(l=>[{id:l.a,term:true,text:BYID[l.a].t},{id:l.b,term:true,text:BYID[l.b].t}]));
    pairsTotal=pairs.length;
    matches=(x,y)=>adjacent(x.id,y.id);
  }else{
    const pool=wsample(termsFor(sec),6,t=>weight(t.id));
    cards=shuffle(pool.flatMap(t=>[{id:t.id,term:true,text:t.t},{id:t.id,term:false,text:short(t)}]));
    pairsTotal=pool.length;
    matches=(x,y)=>x.id===y.id&&x.term!==y.term;
  }
  let first=null,lock=false,moves=0,pairs=0,secs=0;
  const movesEl=h("span",{},"Drag: 0"),timeEl=h("span",{},"0 s");
  const timer=setInterval(()=>{secs++;timeEl.textContent=secs+" s"},1000);cleanup=()=>clearInterval(timer);
  const log=h("div",{class:"log","aria-live":"polite"});
  const els=cards.map((c,k)=>h("button",{class:"mc","aria-label":"Dolt kort, tryck för att vända",onclick:()=>flip(k)},"❓"));
  const show=(k,on)=>{
    const c=cards[k],b=els[k];
    b.className="mc"+(on?" open"+(c.term?" term":""):"")+(on?" pop":"");
    b.textContent=on?c.text:"❓";
    b.setAttribute("aria-label",on?c.text:"Dolt kort, tryck för att vända");
  };
  function flip(k){
    if(lock||els[k].dataset.done||first===k)return;
    sfx.flip();show(k,true);
    if(first===null){first=k;return}
    moves++;movesEl.textContent="Drag: "+moves;
    const a=first;first=null;
    if(matches(cards[a],cards[k])){
      [a,k].forEach(n=>{els[n].dataset.done="1";els[n].className="mc done";els[n].disabled=true});
      sfx.ok();addXp(5);record(cards[k].id,true);record(cards[a].id,true);pairs++;
      if(variant==="links"){
        const l=NB.get(cards[a].id).find(n=>n.o.id===cards[k].id).l;
        log.prepend(h("div",{class:"model"},h("b",{},`${BYID[l.a].t} ↔ ${BYID[l.b].t}`),h("p",{},l.why)));
      }
      if(pairs===pairsTotal)finish();
    }else{
      lock=true;record(cards[a].id,false);record(cards[k].id,false);sfx.bad();
      setTimeout(()=>{show(a,false);show(k,false);lock=false},1300);
    }
  }
  function finish(){
    clearInterval(timer);played();

      extra:variant==="links"&&log.children.length?h("div",{style:"text-align:left;margin-top:10px"},h("h3",{},"Sambanden du hittade:"),log):null,
      again:()=>playMemory(sec,variant)}),1100);
  }

function playSort(set){
  const queue=shuffle(set.items).slice(0,Math.min(8,set.items.length));
  const total=queue.length;let done=0,firstTry=0,xp=0;const retried=new Set();
  function show(){
    if(!queue.length)return finish();
    const [text,right]=queue[0];let busy=false;
    const bs=set.buckets.map((b,k)=>h("button",{class:"bucket",onclick:()=>pick(k)},b));
    const card=h("div",{class:"sortcard"},text);
    app.replaceChildren(
      h("div",{class:"stat"},h("span",{},`Kort ${Math.min(done+1,total)}/${total}`),h("span",{class:"grow"}),h("span",{},`${firstTry} rätt direkt`)),
      h("div",{class:"prog"},h("i",{style:`width:${done/total*100}%`})),
      h("h3",{},set.name),card,h("div",{class:"buckets",role:"group","aria-label":"Välj låda"},bs));
    function pick(k){
      if(busy)return;busy=true;
      bs.forEach(b=>b.disabled=true);
      if(k===right){
        bs[k].classList.add("right");sfx.ok();
        if(!retried.has(text)){firstTry++;xp+=8;addXp(8)}
        queue.shift();done++;
        setTimeout(show,600);
      }else{
        bs[k].classList.add("wrong");bs[right].classList.add("right");card.classList.add("shake");sfx.bad();
        card.append(h("div",{style:"font-size:1rem;font-weight:600;margin-top:8px"},`Rätt: ${set.buckets[right]}`));
        retried.add(text);const it=queue.shift();queue.push(it);
        setTimeout(show,1700);
      }
    }
  }
  function finish(){
    played();const perfect=firstTry===total;
    if(perfect){unlock("sorter");sfx.win();confetti()}
    const stars=perfect?3:firstTry>=Math.ceil(total*.7)?2:1;
    results({title:perfect?"Felfritt! 🎉":"Klart!",stars,lines:[`${firstTry} av ${total} rätt på första försöket · +${xp} XP`],again:()=>playSort(set)});
  }
  show();
}

    if(idx>=ts.length)return finish();
    mark(idx);
    const my=++run,t=ts[idx];
    const u=new SpeechSynthesisUtterance(`${t.t}. ${t.d} Exempel: ${t.e}`);
    u.lang="sv-SE";u.voice=svVoices()[0]||null;u.rate=rate;
    u.onend=()=>{if(my===run&&playing){idx++;speak()}};
    u.onerror=e=>{if(my===run&&playing&&e.error!=="canceled"&&e.error!=="interrupted"){idx++;speak()}};
    synth.speak(u);
  }
  function play(){
    if(!check())return;
    if(idx>=items().length)idx=0;
    playing=true;run++;if(synth.speaking||synth.pending)synth.cancel();
    playBtn.textContent="⏸ Pausa";speak();
  }
  function pause(){
    playing=false;run++;if(synth)synth.cancel();
    playBtn.textContent="▶ Fortsätt";
  }
  function finish(){
    playing=false;idx=0;mark(-1);playBtn.textContent="▶ Lyssna igen";
    const first=!S.heard["s"+sec];S.heard["s"+sec]=true;save();played();
    if(first){addXp(20);toast("🎧 Avsnittet klart! +20 XP");sfx.win()}
    
    drawSections();
    const n=sec+1;
    next.replaceChildren(SECTIONS[n]
      ?h("button",{class:"btn",onclick:()=>{sec=n;idx=0;drawSections();drawList();play()}},"Nästa avsnitt ▶")
      :h("button",{class:"btn",onclick:()=>go("oral")},"Testa dig själv: Förklara högt ▶"));
  }
  cleanup=()=>{playing=false;run++;if(synth){synth.cancel();synth.onvoiceschanged=null}};
  drawSections();drawList();check();
  app.append(h("h2",{},"🎧 Lyssna"),
    h("p",{class:"sub"},"Perfekt att lyssna på innan du sover eller på bussen. Lyssna klart på podden för XP och en bricka."),
    h("h3",{},"Geografipodden – två röster"),
    h("div",{class:"grid menu"},h("button",{class:"tile",onclick:()=>go("episode")},
      h("span",{class:"em","aria-hidden":"true"},"🎧"),
      h("b",{},PODCAST.t,S.heard.pod?h("span",{class:"done-tag"}," ✓ lyssnat"):null),
      h("span",{class:"d"},PODCAST.min))),
    h("h3",{style:"margin-top:22px"},"Begreppen upplästa av enhetens röst"),
    h("p",{class:"hint"},"Enhetens röst läser upp varje begrepp, vad det betyder och exemplet. Lyssna klart på ett avsnitt för XP."),
    h("div",{class:"card"},chips,h("div",{class:"row"},playBtn,restart),speedEls,status),next,listEl);
};

VIEWS.episode=()=>{
  const ep=PODCAST;let rate=1;
  const audio=h("audio",{controls:true,preload:"metadata",src:ep.audio,style:"width:100%;margin-bottom:6px"});
  const status=h("p",{class:"hint","aria-live":"polite"},"Hör du inget? Kolla att volymen är uppe och att enheten inte är på ljudlöst.");
  const speeds=[["Lugnt",.85],["Normalt",1],["Snabbt",1.2]];
  const speedEls=h("div",{class:"chips",role:"group","aria-label":"Hastighet",style:"margin:8px 0"});
  const drawSpeeds=()=>speedEls.replaceChildren(...speeds.map(([l,v])=>h("button",{class:"chip","aria-pressed":String(rate===v),onclick:()=>{rate=v;audio.playbackRate=v;drawSpeeds()}},l)));
  drawSpeeds();
  const transcript=h("div",{class:"transcript",hidden:true},ep.lines.map(([who,text])=>h("div",{class:"pl "+(who==="A"?"host":"exp")},h("b",{},who==="A"?"Röst 1":"Röst 2"),h("span",{},text))));
  const textToggle=h("button",{class:"chip","aria-pressed":"false",onclick:e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",String(on));transcript.hidden=!on}},"Visa text");
  const next=h("div",{style:"margin-top:14px"});
  audio.addEventListener("play",()=>{audio.playbackRate=rate});
  audio.addEventListener("error",()=>{status.textContent="Kunde inte ladda ljudet. Kolla internetanslutningen och ladda om sidan."});
  audio.addEventListener("ended",()=>{
    const first=!S.heard.pod;S.heard.pod=true;save();played();
    if(first){addXp(30);toast("🎧 Podden klar! +30 XP");sfx.win()}
    unlock("lyssna");
    next.replaceChildren(h("button",{class:"btn",onclick:()=>go("oral")},"Testa dig själv: Förklara högt ▶"));
  });
  cleanup=()=>audio.pause();
  app.append(h("h2",{},"🎧 "+ep.t),h("div",{class:"card"},audio,h("div",{class:"row"},textToggle),speedEls,status),next,transcript);
};

/* ============ PLUGGA ============ */
VIEWS.study=focus=>{
  let sec=0,query="",openAll=false,focusId=focus||null;
  const list=h("div",{class:"list"}),chips=h("div",{class:"chips",role:"group","aria-label":"Välj avsnitt"});
  const search=h("input",{type:"search","aria-label":"Sök begrepp",placeholder:"Sök begrepp…",oninput:e=>{query=e.target.value.toLowerCase();draw()}});
  const toggle=h("button",{class:"chip","aria-pressed":"false",onclick:e=>{openAll=!openAll;e.target.setAttribute("aria-pressed",String(openAll));draw()}},"Visa alla förklaringar");
  function draw(){
    chips.replaceChildren(...[[0,"Alla"],...Object.entries(SECTIONS).map(([k,v])=>[+k,`${k}. ${v}`])].map(([k,v])=>h("button",{class:"chip","aria-pressed":String(sec===k),onclick:()=>{sec=k;draw()}},v)),toggle);
    const ts=termsFor(sec).filter(t=>!query||(t.t+" "+t.d+" "+t.e).toLowerCase().includes(query));
    list.replaceChildren(...(ts.length?ts.map(t=>{
      const links=NB.get(t.id)||[];
      const d=h("details",{class:"t",id:"term-"+t.id},
        h("summary",{},h("span",{class:"dot"+(mastered(t.id)?" m":""),title:mastered(t.id)?"Bemästrat":"Inte bemästrat än"}),t.t),
        h("div",{class:"d"},
          h("p",{},h("b",{},"Betyder: "),t.d),
          h("div",{class:"ex"},h("b",{},"Förklarande exempel: "),t.e),
          links.length?h("div",{class:"links"},h("b",{},"Hänger ihop med – tryck för att hoppa dit:"),
            links.map(({o,why})=>h("button",{class:"linkrow",onclick:()=>{focusId=o.id;sec=0;query="";search.value="";draw()}},h("b",{},o.t),": ",why))):null,
          canSpeak()?h("button",{class:"btn ghost",style:"margin-top:8px",onclick:()=>speakNow(`${t.t}. ${t.d} ${t.e}`)},"🔊 Läs upp"):null));
      d.open=openAll||t.id===focusId;return d;
    }):[h("p",{},"Inga begrepp hittades.")]));
    if(focusId){const el=document.getElementById("term-"+focusId);focusId=null;if(el)el.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"})}
  }
  cleanup=()=>{if(synth)synth.cancel()};
  draw();
  app.append(h("h2",{},"📖 Plugga begrepp"),h("p",{class:"sub"},"Tryck på ett begrepp för att se vad det betyder, exemplet och vilka andra begrepp det hänger ihop med. Tips: försök förklara det högt innan du öppnar! Grön prick = du kan det."),search,chips,list);
};
